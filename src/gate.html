<style>
#gate{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;place-items:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gated #gate{display:grid}
.gated #app{visibility:hidden}
.gatecard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 26px;display:grid;gap:18px;text-align:center;box-shadow:0 18px 50px rgba(21,35,63,.08)}
.gatecard .logo{width:72px;height:72px;margin:0 auto}
.gatecard h1{font-size:34px}
.gatecard .gtag{color:var(--muted);margin:-8px 0 0;font-size:15px}
.gatelist{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0;padding:0;list-style:none}
.gatelist li{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
#gateForm{display:grid;gap:10px;text-align:start}
#gateForm label{font-weight:600;font-size:14px}
#gateEmail{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px;background:var(--surface);direction:ltr;text-align:left}
#gateEmail:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
#gateBtn{min-height:48px;font-size:16px;border-radius:10px}
#gateMsg{min-height:20px;margin:0;font-size:13.5px;color:var(--err);font-weight:600}
.gatefoot{font-size:12.5px;color:var(--muted);margin:0}
.gatefoot a{color:inherit}
.userchip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.userchip span{direction:ltr;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip button{border:0;background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
</style>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gatecard">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#15233F"/><g fill="#F29A1E"><rect x="13" y="13" width="9.6" height="9.6" rx="1.6"/><rect x="25.4" y="13" width="9.6" height="9.6" rx="1.6" opacity=".55"/><rect x="13" y="25.4" width="9.6" height="9.6" rx="1.6" opacity=".55"/><rect x="25.4" y="25.4" width="9.6" height="9.6" rx="1.6"/></g><path d="M6.5 10.5h3.5M10.5 6.5V10M41.5 10.5H38M37.5 6.5V10M6.5 37.5h3.5M10.5 41.5V38M41.5 37.5H38M37.5 41.5V38" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
    <h1 id="gateTitle">مونتاج</h1>
    <p class="gtag">أدوات المصمم للمطبعة</p>
    <ul class="gatelist"><li>قوالب الأكواب</li><li>حاسبة الأفرخ</li><li>حاسبة الاستيكرات</li><li>حاسبة الأكريليك</li></ul>
    <form id="gateForm" novalidate>
      <label for="gateEmail">بريدك الإلكتروني</label>
      <input id="gateEmail" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required>
      <button class="btn btn-dl" id="gateBtn" type="submit">ادخل</button>
      <p id="gateMsg" role="alert"></p>
    </form>
    <p class="gatefoot">بدون كلمة مرور · <span class="n">+966 53 470 1732</span></p>
  </div>
</div>
<script>
(function(){
  var KEY="montage_user", root=document.documentElement;
  var EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  function stored(){ try{ return localStorage.getItem(KEY)||""; }catch(e){ return ""; } }
  function store(v){ try{ v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY); }catch(e){} }
  function ping(email){
    return fetch("/api/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email}),keepalive:true});
  }
  function chip(email){
    var row=document.querySelector(".brandrow"); if(!row) return;
    var old=document.getElementById("userChip"); if(old) old.remove();
    var c=document.createElement("div"); c.className="userchip"; c.id="userChip";
    var s=document.createElement("span"); s.textContent=email; c.appendChild(s);
    var b=document.createElement("button"); b.type="button"; b.textContent="خروج";
    b.onclick=function(){ store(""); root.classList.add("gated"); document.getElementById("gateEmail").value=""; document.getElementById("gateEmail").focus(); c.remove(); };
    c.appendChild(b); row.appendChild(c);
  }
  function enter(email){ store(email); root.classList.remove("gated"); chip(email); }

  var current=stored();
  if(current){ chip(current); ping(current).catch(function(){}); }
  else { setTimeout(function(){ var i=document.getElementById("gateEmail"); if(i) i.focus(); },50); }

  document.getElementById("gateForm").addEventListener("submit",function(e){
    e.preventDefault();
    var input=document.getElementById("gateEmail"), msg=document.getElementById("gateMsg"), btn=document.getElementById("gateBtn");
    var email=input.value.trim().toLowerCase();
    if(!EMAIL.test(email)){ msg.textContent="اكتب بريدًا إلكترونيًا صحيحًا، مثل name@example.com"; input.focus(); return; }
    msg.textContent=""; btn.disabled=true; btn.textContent="جارٍ الدخول…";
    ping(email).then(function(r){
      if(r.status===400){ msg.textContent="البريد غير صحيح. تأكد منه وحاول مرة ثانية."; return; }
      enter(email);
    }).catch(function(){ enter(email); })
      .finally(function(){ btn.disabled=false; btn.textContent="ادخل"; });
  });
})();
</script>
