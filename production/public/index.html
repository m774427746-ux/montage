<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أسباركس — الإنتاج</title><link rel="stylesheet" href="/style.css"><script src="/sha256.js" defer></script><script src="/app.js" defer></script></head><body>
<header><div><small>ASBARIX / PRODUCTION</small><h1 data-t="title">إنتاج المطبعة</h1></div><div><button id="language">English</button><button id="sound" data-t="sound">تفعيل الصوت</button><button id="logout" hidden data-t="logout">خروج</button><span id="bell" aria-live="polite"></span></div></header>
<main><p id="message" role="status"></p><form id="login"><h2 data-t="login">تسجيل الدخول</h2><label><span data-t="username">اسم المستخدم</span><input name="username" required autocomplete="username"></label><label><span data-t="password">كلمة المرور</span><input name="password" type="password" required autocomplete="current-password"></label><button data-t="login">تسجيل الدخول</button></form>
<div id="workspace" hidden><p id="identity"></p><aside id="cleanup" hidden><strong data-t="cleanup">بعد التأكد من اكتمال الطلبات وأرشفتها، نظّف الملفات المحمّلة على جهازك.</strong><button id="clean-done" data-t="done">تم التنظيف</button><button id="clean-later" data-t="later">ذكرني لاحقًا</button></aside>
<section id="send"><h2 data-t="send">إرسال للمطبعة</h2><form id="order-form"><div class="grid">
<label><span data-t="customer">العميل أو المشروع</span><input name="customer" required maxlength="200"></label><label><span data-t="product">نوع المنتج</span><input name="product" required maxlength="100"></label><label><span data-t="machine">الماكينة</span><select name="machine" id="machine" required></select></label><label><span data-t="material">الخامة</span><select name="material" id="material" required></select></label>
<label><span data-t="quantity">الكمية</span><input name="quantity" type="number" min="1" max="100000" value="1" required></label><label><span data-t="copies">عدد النسخ</span><input name="copies" type="number" min="1" max="100000" value="1" required></label><label><span data-t="width">العرض</span><input name="width" type="number" min="0.01" max="10000" step="any" required></label><label><span data-t="height">الطول</span><input name="height" type="number" min="0.01" max="10000" step="any" required></label><label><span data-t="unit">الوحدة</span><select name="unit"><option>cm</option><option>mm</option><option>m</option></select></label></div><div id="options" class="grid"></div>
<label><span data-t="notes">تعليمات التنفيذ</span><textarea name="notes" maxlength="4000"></textarea></label><label><span data-t="file">الملف النهائي فقط (PDF، PNG، JPG، TIFF)</span><input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff" required></label><progress id="progress" max="100" value="0"></progress><p id="upload-state" role="status"></p><button id="submit-order" data-t="submit">رفع وإرسال / استئناف</button></form></section>
<section><h2 data-t="orders">الطلبات</h2><div class="grid"><label><span data-t="search">بحث برقم الطلب أو العميل</span><input id="search" type="search"></label><label><span data-t="machine">الماكينة</span><select id="filter-machine"></select></label><label><span data-t="status">الحالة</span><select id="filter-status"></select></label><label><span data-t="date">التاريخ</span><input id="filter-date" type="date"></label></div><button id="refresh" data-t="refresh">تحديث</button><div id="orders" aria-live="polite"></div></section>
<section id="settings" hidden><h2 data-t="settings">إعدادات الإنتاج المحلية</h2><p data-t="settingsHint">اعتمد الخامات والخيارات قبل إرسال الطلبات. القيم الفارغة تعني أن التكلفة أو السعر غير محدد.</p><form id="material-form"><div class="grid"><label><span data-t="id">المعرف</span><input name="id" required pattern="[a-zA-Z0-9_-]{1,60}"></label><label><span data-t="name">الاسم</span><input name="name" required></label><label><span data-t="machine">الماكينة</span><select name="machine_id" id="settings-machine"></select></label><label><span data-t="unit">الوحدة</span><select name="unit"><option value="piece">piece</option><option value="cm2">cm²</option><option value="m2">m²</option></select></label><label><span data-t="retail">سعر البيع للوحدة</span><input name="retail" type="number" min="0" step="any"></label><label><span data-t="cost">تكلفة الخامة للوحدة</span><input name="cost" type="number" min="0" step="any"></label><label><span data-t="operationCost">تكلفة التشغيل للقطعة (اعتمد 0 عند عدم وجودها)</span><input name="operationCost" type="number" min="0" step="any"></label></div><div id="settings-options" class="grid"></div><button data-t="save">حفظ</button></form>
<form id="user-form"><h3 data-t="addUser">إضافة مستخدم</h3><div class="grid"><label><span data-t="username">اسم المستخدم</span><input name="username" required></label><label><span data-t="name">الاسم</span><input name="name" required></label><label><span data-t="password">كلمة المرور</span><input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label><span data-t="role">الدور</span><select name="role"><option value="designer">designer</option><option value="operator">operator</option><option value="admin">admin</option></select></label></div><button data-t="save">حفظ</button></form>
<form id="machine-form"><h3 data-t="addMachine">إضافة ماكينة</h3><div class="grid"><label><span data-t="id">المعرف</span><input name="id" pattern="[a-z0-9-]{1,40}" required></label><label><span data-t="name">الاسم</span><input name="name" required></label></div><div id="machine-fields"></div><button data-t="save">حفظ</button></form></section>
</div></main></body></html>
