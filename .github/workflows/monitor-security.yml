name: Monitor - security (daily)
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: monitor-security.yml
  cancel-in-progress: false
env:
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
  MONITOR_FROM: ${{ vars.MONITOR_FROM }}
  SITE_URL: ${{ vars.SITE_URL }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GITHUB_TOKEN: ${{ github.token }}
  STATE_DIR: ${{ github.workspace }}/.monitor-state
  TZ: Asia/Riyadh
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .monitor-state
          key: security-${{ github.run_id }}
          restore-keys: security-
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.PROD_REF || 'codex/asbarix-unassigned-ubc-labels-20261108' }}
          path: app
          persist-credentials: false
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: app
      - run: node ../scripts/monitor/security.mjs
        working-directory: app
